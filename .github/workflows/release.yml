name: Release

# Push a tag `v0.1.0` → GitHub release with the huntawayd binaries, install.sh,
# the Android APK, the desktop app for macOS (arm64 .dmg) and Linux (x86_64
# AppImage + .deb), the signed updater artifacts with latest.json, android.json
# for the app's self-update, and SHA256SUMS. install.sh downloads from the latest release.
#
# Desktop secrets: TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD) sign updates;
# APPLE_* (optional) sign and notarize the app.
# Android secrets: ANDROID_KEYSTORE (base64 .jks) + ANDROID_KEYSTORE_PASSWORD
# sign the APK; required, so that each release installs over the previous one.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
      - run: cargo install cargo-zigbuild --locked
      # The daemon reports its crate version (update checks compare it to the tag).
      - name: Version from the tag
        run: V="${GITHUB_REF_NAME#v}" perl -0pi -e 's/^version = .*$/version = "$ENV{V}"/m' bridge/Cargo.toml && grep -m1 '^version' bridge/Cargo.toml
      - working-directory: bridge
        run: |
          cargo zigbuild --release -p huntawayd --target x86_64-unknown-linux-musl
          cargo zigbuild --release -p huntawayd --target aarch64-unknown-linux-musl
      - run: |
          mkdir -p out
          cp bridge/target/x86_64-unknown-linux-musl/release/huntawayd out/huntawayd-linux-x86_64
          cp bridge/target/aarch64-unknown-linux-musl/release/huntawayd out/huntawayd-linux-arm64
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: out }

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The daemon reports its crate version (update checks compare it to the tag).
      - name: Version from the tag
        run: V="${GITHUB_REF_NAME#v}" perl -0pi -e 's/^version = .*$/version = "$ENV{V}"/m' bridge/Cargo.toml && grep -m1 '^version' bridge/Cargo.toml
      - working-directory: bridge
        run: cargo build --release -p huntawayd
      - run: mkdir -p out && cp bridge/target/release/huntawayd out/huntawayd-macos-arm64
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: out }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Build signed APK
        working-directory: app
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          HUNTAWAY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$ANDROID_KEYSTORE" ] || { echo "::error::ANDROID_KEYSTORE secret missing"; exit 1; }
          export HUNTAWAY_KEYSTORE="$RUNNER_TEMP/huntaway.jks"
          echo "$ANDROID_KEYSTORE" | base64 -d > "$HUNTAWAY_KEYSTORE"
          # v1.2.3 → versionName 1.2.3, versionCode 10203 (always increasing).
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "${version%%-*}"
          code=$((major * 10000 + minor * 100 + patch))
          flutter build apk --release --target-platform android-arm64 --build-name "$version" --build-number "$code"
      - name: Collect APK and android.json
        run: |
          mkdir -p out
          apk=huntaway-android-arm64.apk
          cp app/build/app/outputs/flutter-apk/app-release.apk "out/$apk"
          # Read by the app's self-update (releases/latest/download/android.json).
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "${version%%-*}"
          code=$((major * 10000 + minor * 100 + patch))
          jq -n --arg v "$version" --argjson code "$code" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$apk" \
            --arg sha "$(sha256sum "out/$apk" | cut -d' ' -f1)" \
            '{version: $v, version_code: $code, url: $url, sha256: $sha}' > out/android.json
          cat out/android.json
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out }

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-aarch64
          # Oldest supported Ubuntu: the AppImage runs on newer glibc, not older.
          - os: ubuntu-22.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf
      - working-directory: desktop
        run: npm ci
      - working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Unset secrets come through as empty strings, which Tauri would try to use.
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!var}" ] || unset "$var"
          done
          # Updater artifacts need the signing key; without it, plain bundles only.
          updater=false
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then updater=true; fi
          npx tauri build --config "{\"version\":\"$version\",\"bundle\":{\"createUpdaterArtifacts\":$updater}}"
      - name: Collect bundles
        run: |
          mkdir -p out
          b=desktop/src-tauri/target/release/bundle
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp $b/dmg/*.dmg out/huntaway-desktop-macos-arm64.dmg
            update=huntaway-desktop-macos-arm64.app.tar.gz
            [ -f $b/macos/Huntaway.app.tar.gz ] && cp $b/macos/Huntaway.app.tar.gz out/$update
            sigfile=$b/macos/Huntaway.app.tar.gz.sig
          else
            cp $b/deb/*.deb out/huntaway-desktop-linux-amd64.deb
            update=huntaway-desktop-linux-x86_64.AppImage
            cp $b/appimage/*.AppImage out/$update
            sigfile=$(ls $b/appimage/*.AppImage.sig 2>/dev/null || true)
          fi
          # Fragment of latest.json for this platform, merged by the release job.
          if [ -n "$sigfile" ] && [ -f "$sigfile" ]; then
            jq -n --arg p "${{ matrix.platform }}" --arg sig "$(cat $sigfile)" --arg url "$base/$update" \
              '{($p): {signature: $sig, url: $url}}' > out/updater-${{ matrix.platform }}.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: out

  release:
    needs: [linux, macos, android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: |
          cp install.sh out/
          cd out
          # latest.json for the desktop updater, from the per-platform fragments.
          if ls updater-*.json >/dev/null 2>&1; then
            jq -s --arg v "${GITHUB_REF_NAME#v}" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{version: $v, pub_date: $date, platforms: (add)}' updater-*.json > latest.json
            rm updater-*.json
          fi
          sha256sum huntaway* > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" --generate-notes
