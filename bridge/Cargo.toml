[workspace]
resolver = "2"
members = ["crates/herdr-client", "crates/huntaway-api", "crates/huntaway-client", "crates/huntaway-core", "crates/huntaway-demo", "crates/huntawayd"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
herdr-client = { path = "crates/herdr-client" }
huntaway-core = { path = "crates/huntaway-core" }
huntaway-api = { path = "crates/huntaway-api" }
huntaway-client = { path = "crates/huntaway-client" }
